[package]
name = "tire-photo-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["socks-proxy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.27", default-features = false }
rand = "0.10"
resvg = "0.49"
usvg = { version = "0.48", default-features = false, features = ["text"] }
tiny-skia = "0.12"
