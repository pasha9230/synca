[project]
name = "tires-sync"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["flask>=3.1", "cryptography>=50.0.2", "Pillow>=12.3.0", "openpyxl>=3.1.5"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "pytest-xdist>=3.5", "pytest-testmon>=2.2.0", # scripts/test-full.sh: the tests on all cores
       "playwright==1.58.0"]                                                # tests/e2e: the screen audit (browser not installed by pip)

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
