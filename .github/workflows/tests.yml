name: tests

on:
  push:
    branches-ignore: [master]   # master проверяет deploy.yml (проверка «tests / pytest», её ждёт tires-pull)
  # без pull_request и pull_request_target: чужой код из форков здесь не запускается
  workflow_call:

permissions:
  contents: read

# Тесты идут на машинах GitHub (ubuntu-latest): Python 3.12 как на сервере, pip install -e ".[dev]", pytest -n auto.
# Задача одна и называется pytest, поэтому проверка остаётся «tests / pytest» (её ждут tires-pull и защита master).
# Частных документов владельца (Apps Script) и схем поставщика в публичной копии нет: их тесты пропускаются.
# Подробнее: deploy/AUTODEPLOY.md, раздел «Тесты перед выкладкой».

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Без concurrency: одна группа держит в очереди только один ожидающий прогон и отменяет более старый,
    # а это мог бы быть прогон master из deploy.yml; на ubuntu-latest прогоны идут параллельно, это безопасно.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # the server's Python (Ubuntu 24.04); pyproject allows >=3.9
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: install (pyproject, [dev])
        run: python -m pip install -e ".[dev]"
      - name: full run (-n auto)
        run: python -m pytest tests -q --tb=short -n auto
