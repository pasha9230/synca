# Content-addressed photos: the file name is the sha256 of the bytes, so a changed picture always has a new link and may be cached for good.
# Include inside the panel server block. Only `<64 hex>.jpg|png` is served; everything else under /photos/ goes on to the panel.
location ~ ^/photos/[0-9a-f]{64}\.(jpg|png)$ {
    root /var/lib/tires-sync;
    try_files $uri =404;
    expires max;
    add_header Cache-Control "public, immutable";
    access_log off;
}
