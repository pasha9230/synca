# The journal of the panel without the query string: «?q=» holds the phones and the names the staff looks for. The referer too: the panel
# sends «Referrer-Policy: same-origin», so every request after a search carries «…/orders?q=…»; the map keeps the address before «?».
# Токены в адресе не пишем: фид, фото аккаунта, вебхуки, приглашение и код прототипа заменяются на «***» (и в адресе, и в referer).
map $http_referer $panel_referer {
    "~^(?<invite_ref>[^?]*/invite/)"   "${invite_ref}***";
    "~^(?<proto_ref>[^?]*/proto/)"     "${proto_ref}***";
    "~^(?<panel_ref>[^?]*)" $panel_ref;
    default            "";
}
map $uri $panel_uri {
    "~^/feed/[^/]+/(?<feed_rest>.*)$"  "/feed/***/$feed_rest";
    "~^/img/[^/]+/(?<img_rest>.*)$"    "/img/***/$img_rest";
    "~^/hook/(?<hook_kind>[^/]+)/"     "/hook/$hook_kind/***";
    "~^/invite/"                       "/invite/***";
    "~^/proto/[^/]+/(?<proto_rest>.*)$" "/proto/***/$proto_rest";
    "~^/(?<bare_kind>feed|img|proto)/"  "/$bare_kind/***";              # the token alone, without a file after it
    default                            $uri;
}
log_format panel '$remote_addr - $remote_user [$time_local] "$request_method $panel_uri $server_protocol" '
               '$status $body_bytes_sent "$panel_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;   # при установке подставить свой домен

    client_max_body_size 1m;
    server_tokens off;
    access_log /var/log/nginx/access.log panel;

    # HSTS — только в серверном блоке с listen 443 (его правил certbot), один раз: приложение заголовок не ставит (заход tails2, П7).
    # Без includeSubDomains: только этот хост. Строку ниже вставить в блок 443, в блоке listen 80 (редирект) она не нужна:
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ "^/feed/([0-9a-f]{32})/avito_feed\.xml$" {
        alias /var/lib/tires-sync/feed/$1/avito_feed.xml;
        default_type application/xml;
        add_header Cache-Control "no-cache";
        log_not_found off;                        # нет файла — в error.log был бы путь с токеном
    }

    # Статичный прототип для партнёра по секретному коду (решение владельца 2026-10-31): только страницы .html из папки кода, в синке
    # их нет — их кладут на сервер в /var/lib/tires-sync/proto/<код>/. Не в индексы поисковиков, не в кэш, адрес с кодом не уходит
    # referer'ом на CDN шрифтов и скриптов (no-referrer). Своего CSP у nginx нет (заголовки безопасности ставит панель, а сюда она не
    # отвечает), поэтому шрифты и скрипты с CDN грузятся. Нет файла — 404 без пути с кодом в error.log.
    location ~ "^/proto/([0-9a-f]{32})/([A-Za-z0-9._-]+\.html)$" {
        alias /var/lib/tires-sync/proto/$1/$2;
        default_type text/html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        log_not_found off;
        error_log /dev/null crit;
    }

    # Всё остальное под /proto/ (без кода, другие файлы, список папки) — 404, не в панель. Обычный префикс, НЕ «^~»: с «^~» nginx
    # не проверил бы регулярное правило выше и отдал бы 404 и на верную ссылку; так регулярное (если подошло) сильнее префикса.
    location /proto/ {
        access_log off;
        error_log /dev/null crit;
        return 404;
    }

    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/tires-proxy.conf;
    }

    # Ссылки для клиентов: без входа, поэтому свой лимит запросов, и токен в адресе не пишем в журнал nginx.
    location ^~ /s/ {
        limit_req zone=share burst=150 nodelay;
        limit_req_status 429;
        access_log off;
        error_log /dev/null crit;                 # в сообщениях об ошибках тоже есть адрес с токеном
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/tires-proxy.conf;
    }

    # Вебхуки ВК и Авито: без входа, секрет в адресе — не пишем адрес в журналы; тела маленькие (deploy/avito-webhook.md).
    location ^~ /hook/ {
        limit_req zone=share burst=150 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/tires-proxy.conf;
    }

    # Фото аккаунта по токену: адрес не пишем в error.log (502, пока панель перезапускается); access_log с маской из map.
    location ^~ /img/ {
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/tires-proxy.conf;
    }

    # Приглашение сотрудника: токен в адресе, без входа — свой лимит, как у /login; в error.log (лимит, 502) был бы адрес с токеном.
    location ^~ /invite/ {
        limit_req zone=invite burst=5 nodelay;
        limit_req_status 429;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/tires-proxy.conf;
    }

    # Агент фото (docs/superpowers/specs/2026-10-20-tire-photo-generation-design.md): загрузки PNG 2–4 МБ, общий предел 1m дал бы 413.
    location ~ ^/api/(image-jobs|photo-copies|review-sheet)(/|$) {
        client_max_body_size 32m;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/tires-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/tires-proxy.conf;
    }
}
